<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>致亲爱的小公主</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }
        body {
            font-family: "Helvetica Neue", "Luxi Sans", "DejaVu Sans", Tahoma, "Hiragino Sans GB", "Microsoft Yahei", sans-serif;
            letter-spacing: 1.2px;
            background: linear-gradient(160deg, #ff9ec7 0%, #e84a7f 38%, #8b2d5c 72%, #3d1a3d 100%);
            background-attachment: fixed;
            color: #fff;
            overflow: hidden;
        }

        /* ===== 全屏粒子画布（背景层） ===== */
        .canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
            display: block;
        }

        /* ===== 内容覆盖层 ===== */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 36px 20px 28px;
            box-sizing: border-box;
            z-index: 5;
            pointer-events: none;
        }
        .overlay > * { pointer-events: auto; }

        /* ===== 顶部头像 + 标题 ===== */
        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .profile-img {
            width: 132px;
            height: 132px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.85);
            box-shadow: 0 0 0 6px rgba(255, 182, 209, 0.35),
                        0 10px 40px rgba(60, 10, 40, 0.55);
            opacity: 1;
            transition: all 1.0s;
            animation: glow 3.5s ease-in-out infinite;
        }
        @keyframes glow {
            0%, 100% { box-shadow: 0 0 0 6px rgba(255, 182, 209, 0.35), 0 10px 40px rgba(60, 10, 40, 0.55); }
            50%      { box-shadow: 0 0 0 14px rgba(255, 182, 209, 0.12), 0 10px 50px rgba(196, 69, 105, 0.7); }
        }
        .profile-img:hover {
            transform: rotate(360deg);
            box-shadow: 0 0 22px #fff;
        }
        .title {
            margin: 20px 0 6px;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 4px;
            text-shadow: 0 2px 18px rgba(0, 0, 0, 0.35);
        }
        .tagline {
            margin: 0;
            font-size: 15px;
            letter-spacing: 3px;
            color: rgba(255, 255, 255, 0.88);
            text-shadow: 0 1px 10px rgba(0, 0, 0, 0.3);
        }

        /* ===== 玻璃拟态卡片通用 ===== */
        .card {
            background: rgba(255, 255, 255, 0.13);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.28);
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(40, 5, 30, 0.35);
        }

        /* ===== 时光计数卡 ===== */
        .counter-card {
            padding: 18px 26px 22px;
            text-align: center;
            max-width: 520px;
            width: 100%;
        }
        .card-label {
            margin: 0 0 14px;
            font-size: 14px;
            letter-spacing: 3px;
            color: rgba(255, 255, 255, 0.85);
        }
        .counter-grid {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .stat {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            padding: 12px 14px;
            min-width: 66px;
            text-align: center;
        }
        .stat .num {
            display: block;
            font-size: 28px;
            font-weight: 700;
            line-height: 1;
            color: #fff;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.25);
        }
        .stat label {
            display: block;
            font-size: 12px;
            margin-top: 6px;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.78);
        }

        /* ===== 纪念日倒计时小卡 ===== */
        .anni-card {
            margin-top: 12px;
            padding: 10px 22px;
            border-radius: 30px;
            font-size: 14px;
            letter-spacing: 2px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.92);
        }
        .anni-card .anni-icon { font-size: 16px; }
        .anni-num {
            font-size: 18px;
            font-weight: 700;
            color: #ffe4ec;
            font-variant-numeric: tabular-nums;
        }

        .bottom {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ===== 音乐按钮 ===== */
        .music-btn {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.35);
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #fff;
            font-size: 22px;
            cursor: pointer;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        .music-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.08);
        }
        .music-btn.playing {
            background: rgba(255, 182, 209, 0.45);
            animation: musicPulse 2s ease-in-out infinite;
        }
        @keyframes musicPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255, 182, 209, 0.5); }
            50%      { box-shadow: 0 0 0 14px rgba(255, 182, 209, 0); }
        }

        /* ===== Toast 提示（替代 alert） ===== */
        .toast {
            position: fixed;
            top: 28px;
            left: 50%;
            transform: translateX(-50%) translateY(-120px);
            background: rgba(255, 255, 255, 0.95);
            color: #c44569;
            padding: 13px 28px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 1.5px;
            box-shadow: 0 10px 30px rgba(40, 5, 30, 0.3);
            z-index: 100;
            opacity: 0;
            transition: all 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            white-space: nowrap;
            max-width: 90vw;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 480px) {
            .title { font-size: 21px; letter-spacing: 3px; }
            .tagline { font-size: 13px; }
            .stat { min-width: 56px; padding: 10px 10px; }
            .stat .num { font-size: 23px; }
            .counter-card { padding: 16px 16px 20px; }
        }
    </style>
</head>
<body>

<!-- 粒子动画画布（背景） -->
<canvas class="canvas"></canvas>

<!-- 内容覆盖层 -->
<div class="overlay">
    <header class="hero">
        <img src="pic.jpg" class="profile-img" alt="小公主">
        <h1 class="title">致亲爱的小公主</h1>
        <p class="tagline">很高兴，很幸运与你相遇 ♥</p>
    </header>

    <div class="bottom">
        <div class="card counter-card">
            <p class="card-label">我们相处的时光已有</p>
            <div class="counter-grid">
                <div class="stat"><span class="num" id="days">0</span><label>天</label></div>
                <div class="stat"><span class="num" id="hours">00</span><label>时</label></div>
                <div class="stat"><span class="num" id="minutes">00</span><label>分</label></div>
                <div class="stat"><span class="num" id="seconds">00</span><label>秒</label></div>
            </div>
        </div>
        <div class="card anni-card">
            <span class="anni-icon">✨</span>
            <span>距下一个相恋纪念日还有</span>
            <span class="anni-num" id="anniDays">0</span>
            <span>天</span>
        </div>
    </div>
</div>

<!-- 音乐 -->
<button class="music-btn" id="musicBtn" aria-label="背景音乐">♪</button>
<audio id="bgMusic" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
    /* ===== 时光计数器 ===== */
    function show_date_time() {
        window.setTimeout(show_date_time, 1000);
        var BirthDay = new Date("1/7/2024 14:00:00"); // 相恋日期
        var today = new Date();
        var timeold = today.getTime() - BirthDay.getTime();
        var msPerDay = 24 * 60 * 60 * 1000;
        var e_daysold = timeold / msPerDay;
        var daysold = Math.floor(e_daysold);
        var e_hrsold = (e_daysold - daysold) * 24;
        var hrsold = Math.floor(e_hrsold);
        var e_minsold = (e_hrsold - hrsold) * 60;
        var minsold = Math.floor(e_minsold);
        var seconds = Math.floor((e_minsold - minsold) * 60);
        document.getElementById('days').textContent = daysold;
        document.getElementById('hours').textContent = String(hrsold).padStart(2, '0');
        document.getElementById('minutes').textContent = String(minsold).padStart(2, '0');
        document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
    }
    show_date_time();

    /* ===== 纪念日倒计时（每年 1/7） ===== */
    function next_anniversary() {
        var today = new Date();
        var year = today.getFullYear();
        var anni = new Date(year, 0, 7, 14, 0, 0);
        if (anni < today) {
            anni = new Date(year + 1, 0, 7, 14, 0, 0);
        }
        var days = Math.ceil((anni.getTime() - today.getTime()) / (1000 * 60 * 60 * 24));
        document.getElementById('anniDays').textContent = days;
    }
    next_anniversary();

    /* ===== Toast 提示 ===== */
    function showToast(message) {
        var toast = document.getElementById('toast');
        toast.textContent = message;
        toast.classList.add('show');
        setTimeout(function () {
            toast.classList.remove('show');
        }, 3200);
    }

    /* ===== 音乐播放控制 ===== */
    (function () {
        var music = document.getElementById('bgMusic');
        var btn = document.getElementById('musicBtn');
        var playing = false;
        btn.addEventListener('click', function () {
            if (playing) {
                music.pause();
                btn.classList.remove('playing');
            } else {
                music.play().catch(function () {});
                btn.classList.add('playing');
            }
            playing = !playing;
        });
    })();

    /* ===== 粒子动画引擎 ===== */
    var S = {
        init: function () {
            S.Drawing.init('.canvas');
            var a = Math.floor(Math.random() * 4 + 1);
            if (a == 1) {
                showToast("你想吃的我都做~");
                S.UI.simulate("碰见你|遇见你|很幸运|#countdown 3|#time");
            } else if (a == 2) {
                showToast("你想去的地方我都陪你去~");
                S.UI.simulate("想你啦|快快乐乐|开开心心|#countdown 3|#time");
            } else if (a == 3) {
                showToast("你想做的事情我都陪你做~");
                S.UI.simulate("Nice|to|Meet|You|#countdown 3|#time");
            } else {
                showToast("小公主，天天快乐哦~");
                S.UI.simulate("何美女|小公主|何大厨|#countdown 3|#time");
            }
            S.Drawing.loop(function () {
                S.Shape.render();
            });
        }
    };
    S.Drawing = (function () {
        var canvas,
            context,
            renderFn,
            requestFrame = window.requestAnimationFrame ||
                window.webkitRequestAnimationFrame ||
                window.mozRequestAnimationFrame ||
                window.oRequestAnimationFrame ||
                window.msRequestAnimationFrame ||
                function (callback) {
                    window.setTimeout(callback, 1000 / 60);
                };
        return {
            init: function (el) {
                canvas = document.querySelector(el);
                context = canvas.getContext('2d');
                this.adjustCanvas();
                window.addEventListener('resize', function (e) {
                    S.Drawing.adjustCanvas();
                });
            },
            loop: function (fn) {
                renderFn = !renderFn ? fn : renderFn;
                this.clearFrame();
                renderFn();
                requestFrame.call(window, this.loop.bind(this));
            },
            adjustCanvas: function () {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            },
            clearFrame: function () {
                context.clearRect(0, 0, canvas.width, canvas.height);
            },
            getArea: function () {
                return { w: canvas.width, h: canvas.height };
            },
            drawCircle: function (p, c) {
                context.fillStyle = c.render();
                context.beginPath();
                context.arc(p.x, p.y, p.z, 0, 2 * Math.PI, true);
                context.closePath();
                context.fill();
            }
        };
    }());
    S.UI = (function () {
        var interval,
            currentAction,
            time,
            maxShapeSize = 30,
            sequence = [],
            cmd = '#';
        function formatTime(date) {
            var h = date.getHours(),
                m = date.getMinutes(),
                m = m < 10 ? '0' + m : m;
            return h + ':' + m;
        }
        function getValue(value) {
            return value && value.split(' ')[1];
        }
        function getAction(value) {
            value = value && value.split(' ')[0];
            return value && value[0] === cmd && value.substring(1);
        }
        function timedAction(fn, delay, max, reverse) {
            clearInterval(interval);
            currentAction = reverse ? max : 1;
            fn(currentAction);
            if (!max || (!reverse && currentAction < max) || (reverse && currentAction > 0)) {
                interval = setInterval(function () {
                    currentAction = reverse ? currentAction - 1 : currentAction + 1;
                    fn(currentAction);
                    if ((!reverse && max && currentAction === max) || (reverse && currentAction === 0)) {
                        clearInterval(interval);
                    }
                }, delay);
            }
        }
        function performAction(value) {
            var action,
                value,
                current;
            sequence = typeof (value) === 'object' ? value : sequence.concat(value.split('|'));
            timedAction(function (index) {
                current = sequence.shift();
                action = getAction(current);
                value = getValue(current);
                switch (action) {
                    case 'countdown':
                        value = parseInt(value) || 10;
                        value = value > 0 ? value : 10;
                        timedAction(function (index) {
                            if (index === 0) {
                                if (sequence.length === 0) {
                                    S.Shape.switchShape(S.ShapeBuilder.letter(''));
                                } else {
                                    performAction(sequence);
                                }
                            } else {
                                S.Shape.switchShape(S.ShapeBuilder.letter(index), true);
                            }
                        }, 1000, value, true);
                        break;
                    case 'rectangle':
                        value = value && value.split('x');
                        value = (value && value.length === 2) ? value : [maxShapeSize, maxShapeSize / 2];
                        S.Shape.switchShape(S.ShapeBuilder.rectangle(Math.min(maxShapeSize, parseInt(value[0])), Math.min(maxShapeSize, parseInt(value[1]))));
                        break;
                    case 'circle':
                        value = parseInt(value) || maxShapeSize;
                        value = Math.min(value, maxShapeSize);
                        S.Shape.switchShape(S.ShapeBuilder.circle(value));
                        break;
                    case 'time':
                        var t = formatTime(new Date());
                        if (sequence.length > 0) {
                            S.Shape.switchShape(S.ShapeBuilder.letter(t));
                        } else {
                            timedAction(function () {
                                t = formatTime(new Date());
                                if (t !== time) {
                                    time = t;
                                    S.Shape.switchShape(S.ShapeBuilder.letter(time));
                                }
                            }, 1000);
                        }
                        break;
                    default:
                        S.Shape.switchShape(S.ShapeBuilder.letter(current[0] === cmd ? 'HacPai' : current));
                }
            }, 2000, sequence.length);
        }
        return {
            simulate: function (action) {
                performAction(action);
            }
        };
    }());
    S.Point = function (args) {
        this.x = args.x;
        this.y = args.y;
        this.z = args.z;
        this.a = args.a;
        this.h = args.h;
    };
    S.Color = function (r, g, b, a) {
        this.r = r;
        this.g = g;
        this.b = b;
        this.a = a;
    };
    S.Color.prototype = {
        render: function () {
            return 'rgba(' + this.r + ',' + +this.g + ',' + this.b + ',' + this.a + ')';
        }
    };
    S.Dot = function (x, y) {
        this.p = new S.Point({
            x: x,
            y: y,
            z: 5,
            a: 1,
            h: 0
        });
        this.e = 0.07;
        this.s = true;
        this.c = new S.Color(255, 255, 255, this.p.a);
        this.t = this.clone();
        this.q = [];
    };
    S.Dot.prototype = {
        clone: function () {
            return new S.Point({
                x: this.x,
                y: this.y,
                z: this.z,
                a: this.a,
                h: this.h
            });
        },
        _draw: function () {
            this.c.a = this.p.a;
            S.Drawing.drawCircle(this.p, this.c);
        },
        _moveTowards: function (n) {
            var details = this.distanceTo(n, true),
                dx = details[0],
                dy = details[1],
                d = details[2],
                e = this.e * d;
            if (this.p.h === -1) {
                this.p.x = n.x;
                this.p.y = n.y;
                return true;
            }
            if (d > 1) {
                this.p.x -= ((dx / d) * e);
                this.p.y -= ((dy / d) * e);
            } else {
                if (this.p.h > 0) {
                    this.p.h--;
                } else {
                    return true;
                }
            }
            return false;
        },
        _update: function () {
            if (this._moveTowards(this.t)) {
                var p = this.q.shift();
                if (p) {
                    this.t.x = p.x || this.p.x;
                    this.t.y = p.y || this.p.y;
                    this.t.z = p.z || this.p.z;
                    this.t.a = p.a || this.p.a;
                    this.p.h = p.h || 0;
                } else {
                    if (this.s) {
                        this.p.x -= Math.sin(Math.random() * 3.142);
                        this.p.y -= Math.sin(Math.random() * 3.142);
                    } else {
                        this.move(new S.Point({
                            x: this.p.x + (Math.random() * 50) - 25,
                            y: this.p.y + (Math.random() * 50) - 25
                        }));
                    }
                }
            }
            d = this.p.a - this.t.a;
            this.p.a = Math.max(0.1, this.p.a - (d * 0.05));
            d = this.p.z - this.t.z;
            this.p.z = Math.max(1, this.p.z - (d * 0.05));
        },
        distanceTo: function (n, details) {
            var dx = this.p.x - n.x,
                dy = this.p.y - n.y,
                d = Math.sqrt(dx * dx + dy * dy);
            return details ? [dx, dy, d] : d;
        },
        move: function (p, avoidStatic) {
            if (!avoidStatic || (avoidStatic && this.distanceTo(p) > 1)) {
                this.q.push(p);
            }
        },
        render: function () {
            this._update();
            this._draw();
        }
    };
    S.ShapeBuilder = (function () {
        var gap = 13,
            shapeCanvas = document.createElement('canvas'),
            shapeContext = shapeCanvas.getContext('2d'),
            fontSize = 500,
            fontFamily = 'Avenir, Helvetica Neue, Helvetica, Arial, sans-serif';
        function fit() {
            shapeCanvas.width = Math.floor(window.innerWidth / gap) * gap;
            shapeCanvas.height = Math.floor(window.innerHeight / gap) * gap;
            shapeContext.fillStyle = 'red';
            shapeContext.textBaseline = 'middle';
            shapeContext.textAlign = 'center';
        }
        function processCanvas() {
            var pixels = shapeContext.getImageData(0, 0, shapeCanvas.width, shapeCanvas.height).data;
            dots = [],
                pixels,
                x = 0,
                y = 0,
                fx = shapeCanvas.width,
                fy = shapeCanvas.height,
                w = 0,
                h = 0;
            for (var p = 0; p < pixels.length; p += (4 * gap)) {
                if (pixels[p + 3] > 0) {
                    dots.push(new S.Point({
                        x: x,
                        y: y
                    }));
                    w = x > w ? x : w;
                    h = y > h ? y : h;
                    fx = x < fx ? x : fx;
                    fy = y < fy ? y : fy;
                }
                x += gap;
                if (x >= shapeCanvas.width) {
                    x = 0;
                    y += gap;
                    p += gap * 4 * shapeCanvas.width;
                }
            }
            return { dots: dots, w: w + fx, h: h + fy };
        }
        function setFontSize(s) {
            shapeContext.font = 'bold ' + s + 'px ' + fontFamily;
        }
        function isNumber(n) {
            return !isNaN(parseFloat(n)) && isFinite(n);
        }
        function init() {
            fit();
            window.addEventListener('resize', fit);
        }
        init();
        return {
            imageFile: function (url, callback) {
                var image = new Image(),
                    a = S.Drawing.getArea();
                image.onload = function () {
                    shapeContext.clearRect(0, 0, shapeCanvas.width, shapeCanvas.height);
                    shapeContext.drawImage(this, 0, 0, a.h * 0.6, a.h * 0.6);
                    callback(processCanvas());
                };
                image.onerror = function () {
                    callback(S.ShapeBuilder.letter('What?'));
                };
                image.src = url;
            },
            circle: function (d) {
                var r = Math.max(0, d) / 2;
                shapeContext.clearRect(0, 0, shapeCanvas.width, shapeCanvas.height);
                shapeContext.beginPath();
                shapeContext.arc(r * gap, r * gap, r * gap, 0, 2 * Math.PI, false);
                shapeContext.fill();
                shapeContext.closePath();
                return processCanvas();
            },
            letter: function (l) {
                var s = 0;
                setFontSize(fontSize);
                s = Math.min(fontSize,
                    (shapeCanvas.width / shapeContext.measureText(l).width) * 0.8 * fontSize,
                    (shapeCanvas.height / fontSize) * (isNumber(l) ? 1 : 0.45) * fontSize);
                setFontSize(s);
                shapeContext.clearRect(0, 0, shapeCanvas.width, shapeCanvas.height);
                shapeContext.fillText(l, shapeCanvas.width / 2, shapeCanvas.height / 2);
                return processCanvas();
            },
            rectangle: function (w, h) {
                var dots = [],
                    width = gap * w,
                    height = gap * h;
                for (var y = 0; y < height; y += gap) {
                    for (var x = 0; x < width; x += gap) {
                        dots.push(new S.Point({
                            x: x,
                            y: y
                        }));
                    }
                }
                return { dots: dots, w: width, h: height };
            }
        };
    }());
    S.Shape = (function () {
        var dots = [],
            width = 0,
            height = 0,
            cx = 0,
            cy = 0;
        function compensate() {
            var a = S.Drawing.getArea();
            cx = a.w / 2 - width / 2;
            cy = a.h / 2 - height / 2;
        }
        return {
            shuffleIdle: function () {
                var a = S.Drawing.getArea();
                for (var d = 0; d < dots.length; d++) {
                    if (!dots[d].s) {
                        dots[d].move({
                            x: Math.random() * a.w,
                            y: Math.random() * a.h
                        });
                    }
                }
            },
            switchShape: function (n, fast) {
                var size,
                    a = S.Drawing.getArea();
                width = n.w;
                height = n.h;
                compensate();
                if (n.dots.length > dots.length) {
                    size = n.dots.length - dots.length;
                    for (var d = 1; d <= size; d++) {
                        dots.push(new S.Dot(a.w / 2, a.h / 2));
                    }
                }
                var d = 0,
                    i = 0;
                while (n.dots.length > 0) {
                    i = Math.floor(Math.random() * n.dots.length);
                    dots[d].e = fast ? 0.25 : (dots[d].s ? 0.14 : 0.11);
                    if (dots[d].s) {
                        dots[d].move(new S.Point({
                            z: Math.random() * 20 + 10,
                            a: Math.random(),
                            h: 18
                        }));
                    } else {
                        dots[d].move(new S.Point({
                            z: Math.random() * 5 + 5,
                            h: fast ? 18 : 30
                        }));
                    }
                    dots[d].s = true;
                    dots[d].move(new S.Point({
                        x: n.dots[i].x + cx,
                        y: n.dots[i].y + cy,
                        a: 1,
                        z: 5,
                        h: 0
                    }));
                    n.dots = n.dots.slice(0, i).concat(n.dots.slice(i + 1));
                    d++;
                }
                for (var i = d; i < dots.length; i++) {
                    if (dots[i].s) {
                        dots[i].move(new S.Point({
                            z: Math.random() * 20 + 10,
                            a: Math.random(),
                            h: 20
                        }));
                        dots[i].s = false;
                        dots[i].e = 0.04;
                        dots[i].move(new S.Point({
                            x: Math.random() * a.w,
                            y: Math.random() * a.h,
                            a: 0.3,
                            z: Math.random() * 4,
                            h: 0
                        }));
                    }
                }
            },
            render: function () {
                for (var d = 0; d < dots.length; d++) {
                    dots[d].render();
                }
            }
        };
    }());
    S.init();
</script>
